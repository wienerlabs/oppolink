name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# One release at a time; cancel a stale tag if a new one supersedes it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build + sign + publish APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CHANGELOG / release notes lookups want full history

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "RELEASE_KEYSTORE_B64 secret is empty — cannot sign release."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/oppolink"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/oppolink/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/oppolink/release.jks" >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper (first-run)
        run: |
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 8.10.2
          fi

      - name: assembleRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate signed APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/release -name '*-release.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "No signed APK produced." >&2
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oppolink-${{ github.ref_name }}-release-apk
          path: android/${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull the relevant CHANGELOG.md slice for the release notes —
          # we look for "## ${tag}" and stop at the next H2.
          tag="${GITHUB_REF#refs/tags/}"
          notes=$(awk -v tag="## $tag" '
            $0==tag { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' ../CHANGELOG.md || true)
          if [ -z "$notes" ]; then
            notes="OppoLink $tag — see commit history for details."
          fi
          gh release create "$tag" \
            "${{ steps.apk.outputs.path }}" \
            --title "OppoLink $tag" \
            --notes "$notes" \
            --target "${GITHUB_SHA}"
