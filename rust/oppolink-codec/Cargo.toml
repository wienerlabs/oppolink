[package]
name = "oppolink-codec"
description = "libopus bindings + 20 ms VoIP framing for OppoLink."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
thiserror = { workspace = true }
# libopus binding via the `opus` crate. Uses cc-rs to compile a vendored
# libopus 1.5.x snapshot from C — no system libopus, no CMake. Works on
# macOS dev and Android NDK runners alike.
opus = "0.3.0"
