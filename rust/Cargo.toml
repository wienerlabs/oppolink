[workspace]
resolver = "2"
members = [
    "oppolink-codec",
    "oppolink-jitter",
    "oppolink-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "AGPL-3.0-only"
repository = "https://github.com/wienerlabs/oppolink"
publish = false

[workspace.dependencies]
uniffi = { version = "0.28", default-features = false }
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
# NOTE: do not `strip = "symbols"` here — UniFFI bindgen's `--library` mode
# reads metadata sections that the Linux linker drops together with the
# regular symbol table. cargo-ndk strips the Android-shipped .so itself.

[profile.dev]
opt-level = 1
overflow-checks = true
